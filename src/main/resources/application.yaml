spring:
  application:
    name: invest
  # MySQL DB
  datasource:
    url: jdbc:mysql://localhost:3306/Juby
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true # Hibernate가 실행한 SQL 쿼리를 콘솔에 출력
    properties: # 출력된 SQL 쿼리를 읽기 쉽게 정렬
      hibernate:
        format_sql: true

  # 소셜로그인
  security:
    oauth2:
      client:
        registration:
          naver:
            client-name: naver
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: http://localhost:8080/login/oauth2/code/naver
            authorization-grant-type: authorization_code
            scope:
              - name # 하이픈 뒤에 띄어서 써야함!!!
              - email
              - profile_image
              - birth
          google:
            client-name: google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: http://localhost:8080/login/oauth2/code/google
            authorization-grant-type: authorization_code
            scope:
              - email
              - profile

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize # Authorization Server 서비스 로그인창 주소
            token-uri: https://nid.naver.com/oauth2.0/token # Authorization Server 토큰 교환 주소
            user-info-uri: https://openapi.naver.com/v1/nid/me #Resource Server
            user-name-attribute: response

kis:
  mock:
    base-url: "https://openapivts.koreainvestment.com:29443"
    app-key: ${KIS_APPKEY}
    app-secret: ${KIS_APPSECRET}
  real:
    base-url: "https://openapi.koreainvestment.com:9443"
    app-key: ${KIS_REALAPPKEY}
    app-secret: ${KIS_REALAPPSECRET}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 1800000 # 30분
  refresh-token-validity: 1209600000 # 14일