spring:
  application:
    name: invest
  profiles:
    active: local

  # 사용할 DB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 소셜 로그인
  security:
    oauth2:
      client:
        registration:
          naver:
            client-name: naver
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope:
              - name # 하이픈 뒤에 띄어서 써야함!!!
              - email
              - profile_image
              - birth
          google:
            client-name: google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope:
              - email
              - profile
          kakao:
            client-name: kakao
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - account_email

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize # Authorization Server 서비스 로그인창 주소
            token-uri: https://nid.naver.com/oauth2.0/token # Authorization Server 토큰 교환 주소
            user-info-uri: https://openapi.naver.com/v1/nid/me #Resource Server
            user-name-attribute: response

          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

kis:
  mock:
    base-url: "https://openapivts.koreainvestment.com:29443"
    app-key: ${KIS_MOCK_APP_KEY}
    app-secret: ${KIS_MOCK_APP_SECRET}
  real:
    base-url: "https://openapi.koreainvestment.com:9443"
    app-key: ${KIS_REAL_APP_KEY}
    app-secret: ${KIS_REAL_APP_SECRET}

naver:
  news:
    base-url: "https://openapi.naver.com/v1/search/news.json"
    app-key: ${NAVER_CLIENT_ID}
    app-secret: ${NAVER_CLIENT_SECRET}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 1800000 # 30분
  refresh-token-validity: 1209600000 # 14일

aes:
  secret: ${AES_128}

pinecone:
  app-key: ${PINECONE_APP_KEY}