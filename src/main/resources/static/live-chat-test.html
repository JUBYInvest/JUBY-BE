<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>실시간 채팅 테스트</title>
    <!-- STOMP 클라이언트. 전역 StompJs를 만든다. -->
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: #fff; color: #111; }
        .token-bar { display: flex; gap: 8px; align-items: center; padding: 8px 16px; background: #222; color: #fff; flex-wrap: wrap; font-size: 13px; }
        .token-bar input { flex: 1; min-width: 200px; padding: 6px 8px; }
        .token-bar .status { color: #9ad; }
        .chat { max-width: 720px; margin: 24px auto; padding: 0 16px; }
        .chat-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: 2px solid #111; }
        .chat-header h2 { margin: 0; font-size: 26px; }
        .chat-header .sub { color: #555; font-size: 15px; }
        .messages { height: 520px; overflow-y: auto; padding: 8px 0; }
        .more { text-align: center; color: #888; font-size: 13px; padding: 8px; }
        .msg { display: flex; gap: 12px; padding: 10px 0; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #f0f1f3; color: #555; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
        .meta { font-size: 15px; margin-bottom: 8px; }
        .meta b { margin-right: 8px; }
        .meta span { color: #888; }
        .bubble { display: inline-block; background: #f2f3f5; padding: 12px 18px; border-radius: 16px; font-size: 16px; white-space: pre-wrap; word-break: break-word; }
        .footer { border-top: 1px solid #ddd; padding-top: 14px; }
        .footer form { display: flex; gap: 8px; }
        .footer input { flex: 1; padding: 10px 12px; font-size: 15px; border: 1px solid #ccc; border-radius: 8px; }
        .footer button { padding: 10px 18px; border: 0; border-radius: 8px; background: #1a7f37; color: #fff; font-size: 15px; }
        .footer button:disabled { background: #aaa; }
        .notice { color: #555; font-size: 15px; margin: 6px 0; }
        .notice b { color: #1a7f37; }
        .error { color: #c62828; font-size: 14px; min-height: 20px; margin-top: 8px; }
    </style>
</head>
<body>
<div class="token-bar">
    <span>accessToken</span>
    <input id="accessToken" placeholder="비우면 비로그인(읽기 전용)으로 연결">
    <button onclick="saveToken()">저장 후 재연결</button>
    <span class="status" id="connStatus">연결 안 됨</span>
</div>

<div class="chat">
    <div class="chat-header">
        <h2>채팅</h2>
        <span class="sub">모두가 함께 쓰는 대화방</span>
    </div>

    <div class="messages" id="messages"></div>

    <div class="footer">
        <form id="sendForm" onsubmit="send(event)">
            <input id="content" maxlength="300" placeholder="메시지를 입력하세요" autocomplete="off">
            <button id="sendBtn" type="submit">보내기</button>
        </form>
        <p class="notice" id="guestNotice"><b>로그인</b> 하면 채팅에 참여할 수 있어요.</p>
        <div class="error" id="error"></div>
    </div>
</div>

<script>
    const TOKEN_KEY = "live-chat-test-token";
    const PAGE_SIZE = 50;
    const seen = new Set();   // 이전 대화와 실시간 메시지가 겹칠 수 있어 messageId로 거른다.
    let nextCursor = null;
    let hasNext = false;
    let loadingMore = false;
    let client = null;

    const $ = id => document.getElementById(id);
    const getToken = () => $("accessToken").value.trim();

    function saveToken() {
        try { localStorage.setItem(TOKEN_KEY, getToken()); } catch (e) {}
        connect();
    }

    function formatTime(iso) {
        return new Date(iso).toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" });
    }

    function renderMessage(m) {
        const row = document.createElement("div");
        row.className = "msg";
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = (m.writerNickname || "?").charAt(0);
        const body = document.createElement("div");
        const meta = document.createElement("div");
        meta.className = "meta";
        const name = document.createElement("b");
        name.textContent = m.writerNickname;
        const time = document.createElement("span");
        time.textContent = formatTime(m.createdAt);
        meta.append(name, time);
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = m.content; // innerHTML 금지: 남이 보낸 내용이다
        body.append(meta, bubble);
        row.append(avatar, body);
        return row;
    }

    function appendLive(m) {
        if (seen.has(m.messageId)) return;
        seen.add(m.messageId);
        const box = $("messages");
        const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
        box.append(renderMessage(m));
        if (atBottom) box.scrollTop = box.scrollHeight;
    }

    // 이전 대화를 위쪽에 붙인다. 보고 있던 위치가 밀리지 않게 스크롤을 보정한다.
    function prependHistory(messages) {
        const box = $("messages");
        const before = box.scrollHeight;
        const fragment = document.createDocumentFragment();
        messages.filter(m => !seen.has(m.messageId)).forEach(m => {
            seen.add(m.messageId);
            fragment.append(renderMessage(m));
        });
        box.prepend(fragment);
        box.scrollTop += box.scrollHeight - before;
    }

    async function loadHistory(cursor) {
        const query = "?size=" + PAGE_SIZE + (cursor ? "&cursor=" + cursor : "");
        const res = await fetch("/api/live-chat/messages" + query).then(r => r.json());
        if (!res.isSuccess) { $("error").textContent = "[" + res.code + "] " + res.message; return; }
        nextCursor = res.result.nextCursor;
        hasNext = res.result.hasNext;
        prependHistory(res.result.messages);
    }

    $("messages").addEventListener("scroll", async () => {
        if ($("messages").scrollTop > 0 || !hasNext || loadingMore) return;
        loadingMore = true;
        try { await loadHistory(nextCursor); } finally { loadingMore = false; }
    });

    function setLoggedIn(loggedIn) {
        $("content").disabled = !loggedIn;
        $("sendBtn").disabled = !loggedIn;
        $("guestNotice").style.display = loggedIn ? "none" : "block";
    }

    function connect() {
        if (client) client.deactivate();
        const token = getToken();
        setLoggedIn(!!token);
        $("error").textContent = "";

        const scheme = location.protocol === "https:" ? "wss://" : "ws://";
        client = new StompJs.Client({
            brokerURL: scheme + location.host + "/ws/live-chat",
            // 브라우저 WebSocket은 헤더를 못 보내므로 토큰은 CONNECT 프레임에 싣는다.
            connectHeaders: token ? { Authorization: "Bearer " + token } : {},
            reconnectDelay: 3000,
            heartbeatIncoming: 10000,
            heartbeatOutgoing: 10000,
        });

        client.onConnect = () => {
            $("connStatus").textContent = token ? "연결됨 (회원)" : "연결됨 (비로그인)";
            client.subscribe("/topic/live-chat", frame => appendLive(JSON.parse(frame.body)));
            // 보낸 메시지가 거부되면 나에게만 온다. 연결은 유지된다.
            client.subscribe("/user/queue/errors", frame => {
                const err = JSON.parse(frame.body);
                $("error").textContent = "[" + err.code + "] " + err.message;
                if (err.code === "AUTH401_1") $("error").textContent += " → AT 재발급 후 '저장 후 재연결'";
            });
        };

        // CONNECT가 거부되면(무효 토큰 등) ERROR 프레임이 온다. message 헤더가 에러 코드다.
        client.onStompError = frame => {
            $("connStatus").textContent = "연결 거부: " + frame.headers["message"];
            $("error").textContent = frame.body;
            client.deactivate(); // 같은 토큰으로 계속 재시도하지 않는다
        };
        client.onWebSocketClose = () => {
            if ($("connStatus").textContent.startsWith("연결됨")) $("connStatus").textContent = "재연결 중...";
        };

        client.activate();
    }

    function send(event) {
        event.preventDefault();
        const content = $("content").value;
        if (!content.trim() || !client || !client.connected) return;
        $("error").textContent = "";
        client.publish({ destination: "/app/live-chat/messages", body: JSON.stringify({ content }) });
        $("content").value = "";
    }

    (async function init() {
        try { $("accessToken").value = localStorage.getItem(TOKEN_KEY) || ""; } catch (e) {}
        await loadHistory(null);
        $("messages").scrollTop = $("messages").scrollHeight;
        connect();
    })();
</script>
</body>
</html>
