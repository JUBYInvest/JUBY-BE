<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OpenAI 챗봇 테스트</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; height: 100%;
            font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
            background: #fff; color: #222;
        }
        .app {
            display: flex;
            height: calc(100% - 44px); /* 상단 토큰바 높이만큼 제외 */
        }

        /* ===== 상단 토큰 바 ===== */
        .token-bar {
            height: 44px;
            display: flex; align-items: center; gap: 8px;
            padding: 0 12px;
            background: #202123; color: #eee;
            font-size: 13px;
        }
        .token-bar input {
            flex: 1; max-width: 640px;
            padding: 6px 8px; border-radius: 6px; border: 1px solid #555;
            background: #2f3033; color: #eee;
        }
        .token-bar button {
            padding: 6px 12px; border-radius: 6px; border: none;
            background: #10a37f; color: #fff; cursor: pointer;
        }
        .token-bar #tokenStatus { color: #9ad; }

        /* ===== 사이드바 ===== */
        .sidebar {
            width: 260px; flex-shrink: 0;
            background: #f7f7f8; border-right: 1px solid #e5e5e5;
            display: flex; flex-direction: column;
        }
        .sidebar-header {
            padding: 12px; border-bottom: 1px solid #e5e5e5;
        }
        .sidebar-header button {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc;
            background: #fff; cursor: pointer; font-size: 14px; font-weight: bold;
        }
        .sidebar-header button:hover { background: #f0f0f0; }
        .session-list {
            flex: 1; overflow-y: auto; padding: 6px;
        }
        .session-item {
            display: flex; align-items: center; gap: 6px;
            padding: 10px 8px; border-radius: 8px; cursor: pointer;
            font-size: 14px; margin-bottom: 2px;
        }
        .session-item:hover { background: #ececec; }
        .session-item.active { background: #e2e2e2; }
        .session-item .title {
            flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .session-item .icon-btn {
            border: none; background: transparent; cursor: pointer; color: #888; font-size: 13px;
            padding: 2px 4px; border-radius: 4px;
        }
        .session-item .icon-btn:hover { background: #d8d8d8; color: #222; }
        .session-empty {
            color: #999; font-size: 13px; padding: 12px 8px;
        }

        /* ===== 채팅 영역 ===== */
        .chat-area {
            flex: 1; display: flex; flex-direction: column; min-width: 0;
        }
        .chat-topbar {
            padding: 12px 16px; border-bottom: 1px solid #e5e5e5;
            display: flex; align-items: center; gap: 10px;
            font-size: 15px; font-weight: bold;
        }
        .chat-topbar .meta {
            font-weight: normal; color: #888; font-size: 12px; margin-left: auto;
        }
        .messages {
            flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px;
        }
        .bubble-row { display: flex; }
        .bubble-row.user { justify-content: flex-end; }
        .bubble-row.assistant { justify-content: flex-start; }
        .bubble {
            max-width: 70%; padding: 10px 14px; border-radius: 14px;
            white-space: pre-wrap; word-break: break-word; line-height: 1.5; font-size: 14px;
        }
        .bubble.user { background: #10a37f; color: #fff; border-bottom-right-radius: 4px; }
        .bubble.assistant { background: #f1f1f3; color: #222; border-bottom-left-radius: 4px; }
        .bubble.pending { color: #999; font-style: italic; }
        .empty-chat {
            margin: auto; color: #999; text-align: center; font-size: 14px;
        }

        .composer {
            border-top: 1px solid #e5e5e5; padding: 12px 16px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .composer .row { display: flex; gap: 8px; }
        .composer input#stockName {
            width: 200px; padding: 8px 10px; border-radius: 8px; border: 1px solid #ccc;
        }
        .composer textarea {
            flex: 1; resize: none; height: 44px; padding: 10px 12px;
            border-radius: 8px; border: 1px solid #ccc; font-family: inherit; font-size: 14px;
        }
        .composer button#sendBtn {
            padding: 0 20px; border-radius: 8px; border: none;
            background: #10a37f; color: #fff; cursor: pointer; font-weight: bold;
        }
        .composer button#sendBtn:disabled { background: #aaa; cursor: not-allowed; }
        .composer .hint { font-size: 11px; color: #999; }
    </style>
</head>
<body>

<div class="token-bar">
    <span>accessToken</span>
    <input id="accessToken" placeholder="소셜로그인 후 발급받은 accessToken 붙여넣기">
    <button onclick="saveToken()">저장</button>
    <span id="tokenStatus"></span>
</div>

<div class="app">
    <aside class="sidebar">
        <div class="sidebar-header">
            <button onclick="startNewChat()">+ 새 대화</button>
        </div>
        <div id="sessionList" class="session-list"></div>
    </aside>

    <main class="chat-area">
        <div class="chat-topbar">
            <span id="currentTitle">새 대화</span>
            <span class="meta" id="chatMeta"></span>
        </div>
        <div id="messages" class="messages">
            <div class="empty-chat">왼쪽에서 대화를 선택하거나, "+ 새 대화"로 시작하세요.</div>
        </div>
        <div class="composer">
            <div class="row">
                <input id="stockName" placeholder="종목명 (선택, 비워두면 질문에서 자동 추론)">
            </div>
            <div class="row">
                <textarea id="question" placeholder="질문을 입력하세요 (Enter: 전송, Shift+Enter: 줄바꿈)"></textarea>
                <button id="sendBtn" onclick="sendMessage()">보내기</button>
            </div>
            <div class="hint">같은 대화방 안에서는 "그 종목은?" 같은 후속 질문도 이전 대화를 참고해서 처리합니다.</div>
        </div>
    </main>
</div>

<script>
    let sessions = [];
    let currentSessionId = null;

    // ===== accessToken 관리 (localStorage에 저장해서 새로고침해도 유지) =====
    function getToken() {
        return document.getElementById("accessToken").value.trim();
    }
    function saveToken() {
        localStorage.setItem("openai-test-token", getToken());
        document.getElementById("tokenStatus").textContent = "저장됨";
        loadSessions();
    }
    (function initToken() {
        const saved = localStorage.getItem("openai-test-token");
        if (saved) {
            document.getElementById("accessToken").value = saved;
            document.getElementById("tokenStatus").textContent = "저장된 토큰 로드됨";
        }
    })();

    // ===== 공통 API 호출 =====
    async function api(path, options = {}) {
        const token = getToken();
        if (!token) {
            alert("accessToken을 먼저 입력하고 저장해주세요.");
            throw new Error("no token");
        }
        const response = await fetch(path, {
            ...options,
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token,
                ...(options.headers || {})
            }
        });
        const data = await response.json();
        if (!data.isSuccess) {
            alert(data.message || "요청이 실패했습니다.");
            throw new Error(data.message);
        }
        return data.result;
    }

    // ===== 대화방 목록(사이드바) =====
    async function loadSessions() {
        try {
            sessions = await api("/api/chat-sessions");
        } catch (e) {
            return;
        }
        renderSessionList();
    }

    function renderSessionList() {
        const list = document.getElementById("sessionList");
        list.innerHTML = "";

        if (sessions.length === 0) {
            list.innerHTML = '<div class="session-empty">대화방이 없습니다. "+ 새 대화"로 시작해보세요.</div>';
            return;
        }

        for (const s of sessions) {
            const item = document.createElement("div");
            item.className = "session-item" + (s.chatSessionId === currentSessionId ? " active" : "");
            item.onclick = () => selectSession(s.chatSessionId);

            const title = document.createElement("span");
            title.className = "title";
            title.textContent = s.title;
            item.appendChild(title);

            const renameBtn = document.createElement("button");
            renameBtn.className = "icon-btn";
            renameBtn.textContent = "✎";
            renameBtn.title = "제목 변경";
            renameBtn.onclick = (ev) => { ev.stopPropagation(); renameSession(s.chatSessionId, s.title); };
            item.appendChild(renameBtn);

            const deleteBtn = document.createElement("button");
            deleteBtn.className = "icon-btn";
            deleteBtn.textContent = "🗑";
            deleteBtn.title = "삭제";
            deleteBtn.onclick = (ev) => { ev.stopPropagation(); deleteSession(s.chatSessionId); };
            item.appendChild(deleteBtn);

            list.appendChild(item);
        }
    }

    // ===== 새 대화 =====
    async function startNewChat() {
        try {
            const created = await api("/api/chat-sessions", { method: "POST" });
            sessions.unshift(created);
            await selectSession(created.chatSessionId);
        } catch (e) { /* alert는 api()에서 이미 처리됨 */ }
    }

    // ===== 대화방 선택 & 상세 조회 =====
    async function selectSession(chatSessionId) {
        let detail;
        try {
            detail = await api("/api/chat-sessions/" + chatSessionId);
        } catch (e) {
            return;
        }
        currentSessionId = chatSessionId;
        document.getElementById("currentTitle").textContent = detail.title;
        document.getElementById("chatMeta").textContent = "chatSessionId: " + chatSessionId;
        renderMessages(detail.messages);
        renderSessionList();
    }

    function renderMessages(messages) {
        const box = document.getElementById("messages");
        box.innerHTML = "";

        if (!messages || messages.length === 0) {
            box.innerHTML = '<div class="empty-chat">아직 대화가 없습니다. 아래에서 질문을 입력해보세요.</div>';
            return;
        }

        for (const m of messages) {
            appendBubble(box, m.role, m.content, m.createdAt);
        }
        scrollToBottom(box);
    }

    function appendBubble(box, role, content, createdAt = null, pending = false) {
        const isUser = role === "USER";
        const row = document.createElement("div");
        row.className = "bubble-row " + (isUser ? "user" : "assistant");

        const bubble = document.createElement("div");
        bubble.className = "bubble " + (isUser ? "user" : "assistant") + (pending ? " pending" : "");
        bubble.textContent = content;
        if (createdAt) bubble.title = new Date(createdAt).toLocaleString(); // 마우스 오버 시 작성 시각 표시

        row.appendChild(bubble);
        box.appendChild(row);
        return row;
    }

    function scrollToBottom(box) {
        box.scrollTop = box.scrollHeight;
    }

    // ===== 제목 변경 / 삭제 =====
    async function renameSession(chatSessionId, oldTitle) {
        const newTitle = prompt("새 제목을 입력하세요", oldTitle);
        if (newTitle === null || newTitle.trim() === "") return;
        try {
            await api("/api/chat-sessions/" + chatSessionId, {
                method: "PATCH",
                body: JSON.stringify({ title: newTitle })
            });
        } catch (e) { return; }
        await loadSessions();
        if (chatSessionId === currentSessionId) {
            document.getElementById("currentTitle").textContent = newTitle.trim();
        }
    }

    async function deleteSession(chatSessionId) {
        if (!confirm("이 대화방을 삭제할까요? 되돌릴 수 없습니다.")) return;
        try {
            await api("/api/chat-sessions/" + chatSessionId, { method: "DELETE" });
        } catch (e) { return; }

        sessions = sessions.filter(s => s.chatSessionId !== chatSessionId);
        if (chatSessionId === currentSessionId) {
            currentSessionId = null;
            document.getElementById("currentTitle").textContent = "새 대화";
            document.getElementById("chatMeta").textContent = "";
            document.getElementById("messages").innerHTML =
                '<div class="empty-chat">왼쪽에서 대화를 선택하거나, "+ 새 대화"로 시작하세요.</div>';
        }
        renderSessionList();
    }

    // ===== 질문 전송 =====
    async function sendMessage() {
        const questionBox = document.getElementById("question");
        const question = questionBox.value.trim();
        const stockName = document.getElementById("stockName").value.trim();
        if (!question) return;

        const sendBtn = document.getElementById("sendBtn");
        const box = document.getElementById("messages");
        if (box.querySelector(".empty-chat")) box.innerHTML = "";

        appendBubble(box, "USER", question);
        const pendingRow = appendBubble(box, "ASSISTANT", "답변 생성 중... (수 초 걸릴 수 있어요)", null, true);
        scrollToBottom(box);

        questionBox.value = "";
        sendBtn.disabled = true;

        try {
            const result = await api("/api/open-ai/ask", {
                method: "POST",
                body: JSON.stringify({ question, stockName, chatSessionId: currentSessionId })
            });

            pendingRow.querySelector(".bubble").textContent = result.answer;
            pendingRow.querySelector(".bubble").classList.remove("pending");

            const isNewSession = currentSessionId === null;
            currentSessionId = result.chatSessionId;
            document.getElementById("chatMeta").textContent =
                "chatSessionId: " + result.chatSessionId + " / messageId: " + result.messageId;

            await loadSessions(); // 제목 자동 생성/최근순 갱신 반영
            if (isNewSession) {
                document.getElementById("currentTitle").textContent =
                    (sessions.find(s => s.chatSessionId === currentSessionId) || {}).title || "새 대화";
            }
        } catch (e) {
            pendingRow.remove();
        } finally {
            sendBtn.disabled = false;
            scrollToBottom(box);
        }
    }

    document.getElementById("question").addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // 초기 로드
    if (getToken()) loadSessions();
</script>
</body>
</html>
