<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OpenAI 챗봇 테스트</title>
    <style>
        body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input, textarea { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; }
        textarea { height: 60px; }
        button { margin-top: 16px; padding: 10px 20px; cursor: pointer; }
        #answer { white-space: pre-wrap; background: #f5f5f5; padding: 16px; margin-top: 20px; border-radius: 6px; min-height: 40px; }
        #meta { color: #666; font-size: 0.85em; margin-top: 8px; }
    </style>
</head>
<body>
<h1>OpenAI 챗봇 테스트</h1>
<p>회원가입 시 저장된 투자성향을 기본으로, 질문 내용에 따라 백테스트/뉴스 데이터를 골라 답변합니다.</p>

<label>질문</label>
<textarea id="question">최근 이 종목 실적이랑 수익률 전망 어때?</textarea>

<label>종목명 (선택 — 비워두면 질문에서 자동으로 추론)</label>
<input id="stockName" placeholder="예: 삼성전자 (비워둬도 됨)">

<button onclick="askQuestion()">질문하기</button>

<div id="meta"></div>
<div id="answer"></div>

<script>
    const accessToken = ""; // 소셜로그인하고 나온 accessToken 기입

    async function askQuestion() {
        const question = document.getElementById("question").value.trim();
        const stockName = document.getElementById("stockName").value.trim();
        const answerBox = document.getElementById("answer");
        const metaBox = document.getElementById("meta");

        if (!accessToken) {
            alert("accessToken을 먼저 스크립트에 채워주세요.");
            return;
        }

        answerBox.textContent = "답변 생성 중... (수 초 걸릴 수 있어요)";
        metaBox.textContent = "";

        const start = performance.now();
        try {
            const response = await fetch("/api/open-ai/ask", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + accessToken
                },
                body: JSON.stringify({ question, stockName })
            });

            const data = await response.json();
            const elapsedSec = ((performance.now() - start) / 1000).toFixed(1);

            if (!data.isSuccess) {
                answerBox.textContent = "";
                alert(data.message);
                return;
            }

            answerBox.textContent = data.result.answer;
            metaBox.textContent = `소요시간: ${elapsedSec}초`;
        } catch (e) {
            answerBox.textContent = "요청 실패: " + e;
        }
    }
</script>
</body>
</html>
