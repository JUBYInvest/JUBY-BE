<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>백테스트 프리셋 결과 테스트</title>
    <style>
        body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input, select { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; }
        button { margin-top: 16px; padding: 10px 20px; cursor: pointer; }
        pre { white-space: pre-wrap; background: #f5f5f5; padding: 16px; margin-top: 20px; border-radius: 6px; min-height: 40px; }
    </style>
</head>
<body>
<h1>백테스트 프리셋 결과 테스트</h1>
<p>매일 새벽 배치로 미리 계산되어 DB에 적재된 결과를 조회합니다. 로그인 불필요.</p>

<label>종목코드</label>
<input id="stockCode" placeholder="예: 005930 (삼성전자), 000100 (유한양행)" value="005930">

<label>투자성향</label>
<select id="investType">
    <option value="1">1: 안정형</option>
    <option value="2">2: 안정추구형</option>
    <option value="3" selected>3: 위험중립형</option>
    <option value="4">4: 적극투자형</option>
    <option value="5">5: 공격투자형</option>
</select>

<label>기간 프리셋</label>
<select id="period">
    <option value="ONE_MONTH">1개월</option>
    <option value="THREE_MONTHS">3개월</option>
    <option value="SIX_MONTHS" selected>6개월</option>
    <option value="ONE_YEAR">1년</option>
</select>

<button onclick="getPreset()">조회</button>
<button onclick="getPresetOptions()">투자성향별 선택 가능 기간 목록 조회</button>

<pre id="result"></pre>

<script>
    async function getPreset() {
        const stockCode = document.getElementById("stockCode").value.trim();
        const investType = document.getElementById("investType").value;
        const period = document.getElementById("period").value;
        const resultBox = document.getElementById("result");

        resultBox.textContent = "조회 중...";
        try {
            const response = await fetch(`/api/backtest/preset?stockCode=${encodeURIComponent(stockCode)}&investType=${investType}&period=${period}`);
            const data = await response.json();
            resultBox.textContent = JSON.stringify(data, null, 2);
        } catch (e) {
            resultBox.textContent = "요청 실패: " + e;
        }
    }

    async function getPresetOptions() {
        const resultBox = document.getElementById("result");
        resultBox.textContent = "조회 중...";
        try {
            const response = await fetch("/api/backtest/preset/options");
            const data = await response.json();
            resultBox.textContent = JSON.stringify(data, null, 2);
        } catch (e) {
            resultBox.textContent = "요청 실패: " + e;
        }
    }
</script>
</body>
</html>
